
inherit_from: .rubocop_todo.yml

plugins:
 - rubocop-performance
 - rubocop-capybara
 - rubocop-minitest
 - rubocop-rails
 - rubocop-i18n

AllCops:
  NewCops: enable
  Exclude:
    - 'bin/*'
    - 'dist/*'
    - 'bundle/**/*'
    - 'config/**/*'
    - 'db/**/*'
    - 'db/schema.rb'
    - 'script/**/*'
    - 'vendor/**/*'
    - 'public/**/*'

Style/HashSyntax:
  EnforcedShorthandSyntax: either

Style/Documentation:
  Enabled: false

